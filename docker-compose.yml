services:
  db:
    image: postgres:16-alpine
    container_name: marmitaria-db
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Cuiaba
      PGTZ: America/Cuiaba
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - marmitaria-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  marmitaria-dados:
